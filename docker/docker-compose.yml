version: "3.9"


services:


  backend:

    build:

      context: ..

      dockerfile: docker/Dockerfile.backend


    ports:

      - "8000:8000"



  frontend:


    build:

      context: ..

      dockerfile: docker/Dockerfile.frontend


    ports:

      - "3000:3000"



  ros2:


    build:

      context: ..

      dockerfile: docker/Dockerfile.ros2


    privileged: true


    network_mode: host
