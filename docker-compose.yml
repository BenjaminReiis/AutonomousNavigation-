version: "3.9"

services:

  postgres:

    image: postgres:16

    container_name: navigation_db

    restart: always

    environment:

      POSTGRES_USER: admin

      POSTGRES_PASSWORD: admin

      POSTGRES_DB: navigation

    ports:

      - "5432:5432"

  redis:

    image: redis

    ports:

      - "6379:6379"
